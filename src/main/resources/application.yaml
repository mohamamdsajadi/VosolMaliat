spring:
  application:
    name: vosol-maliat

  datasource:
    url: jdbc:sqlite:${DB_PATH:/home/mohammad/IdeaProjects/VosolMaliat/identifier.sqlite}
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloack.parand.mparsict.com/auth/realms/vosol-maliat}

camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://46.245.79.18:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:https://parand.mparsict.com}
    auth:
      method: oidc
      token-url: ${CAMUNDA_TOKEN_URL:https://keycloack.parand.mparsict.com/auth/realms/camunda-platform/protocol/openid-connect/token}
      client-id: ${CAMUNDA_CLIENT_ID:orchestration}
      client-secret: ${CAMUNDA_CLIENT_SECRET:secret}
      audience: ${CAMUNDA_AUDIENCE:orchestration}
    execution-threads: ${CAMUNDA_EXECUTION_THREADS:4}
    worker:
      defaults:
        max-jobs-active: ${CAMUNDA_WORKER_MAX_JOBS_ACTIVE:4}
        poll-interval: ${CAMUNDA_WORKER_POLL_INTERVAL:PT1S}
        request-timeout: ${CAMUNDA_WORKER_REQUEST_TIMEOUT:PT15S}
    enabled: true

server:
  port: ${SERVER_PORT:8025}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  security:
    bootstrap-admin:
      keycloak-user-id: ${ADMIN_KEYCLOAK_USER_ID:9c512620-10f2-4fcb-a432-57e7c84fb1f5}
      username: ${ADMIN_USERNAME:admin}
      email: ${ADMIN_EMAIL:admin@vosol-maliat.local}
  keycloak:
    bootstrap-users:
      enabled: ${KEYCLOAK_BOOTSTRAP_USERS_ENABLED:true}
      issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloack.parand.mparsict.com/auth/realms/vosol-maliat}
      client-id: ${KEYCLOAK_BOOTSTRAP_CLIENT_ID:vosol-bootstrap-admin}
      client-secret: ${KEYCLOAK_BOOTSTRAP_CLIENT_SECRET:bJYvQXhzSw1vU2zmslcj0gVlbf0jJSJe}
      default-password: ${KEYCLOAK_BOOTSTRAP_DEFAULT_PASSWORD:123}
      temporary-password: ${KEYCLOAK_BOOTSTRAP_TEMPORARY_PASSWORD:false}

logging:
  level:
    com.mparsict.vosolmaliat: DEBUG
    io.camunda.client: INFO
    io.camunda.zeebe: WARN
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
